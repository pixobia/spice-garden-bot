<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <clipPath id="phone2"><rect x="0" y="0" width="360" height="640" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#phone2)">
    <rect width="360" height="640" fill="#ffffff"/>

    <!-- Header with back -->
    <rect x="0" y="0" width="360" height="50" fill="#f6f7f9"/>
    <line x1="0" y1="50" x2="360" y2="50" stroke="#e5e7eb" stroke-width="0.5"/>
    <text x="16" y="33" font-size="24" fill="#168acd">‹</text>
    <text x="36" y="32" font-size="15" font-weight="500" fill="#111827">Your cart  ·  4 items</text>

    <!-- Cart row 1: Paneer Burger × 2 -->
    <rect x="16" y="64" width="52" height="52" rx="8" fill="#e5e7eb"/>
    <text x="42" y="94" font-size="9" fill="#9ca3af" text-anchor="middle">burger</text>
    <text x="80" y="84" font-size="13" font-weight="500" fill="#111827">Paneer Burger</text>
    <text x="80" y="102" font-size="12" fill="#6b7280">₹90 each  ·  ₹180</text>
    <rect x="262" y="76" width="84" height="30" rx="8" fill="#ffffff" stroke="#00000029" stroke-width="0.5"/>
    <text x="276" y="96" font-size="14" fill="#168acd" text-anchor="middle">−</text>
    <text x="304" y="96" font-size="13" font-weight="500" fill="#111827" text-anchor="middle">2</text>
    <text x="332" y="96" font-size="14" fill="#168acd" text-anchor="middle">+</text>
    <line x1="0" y1="132" x2="360" y2="132" stroke="#e5e7eb" stroke-width="0.5"/>

    <!-- Cart row 2: Veg Wrap × 1 -->
    <rect x="16" y="146" width="52" height="52" rx="8" fill="#e5e7eb"/>
    <text x="42" y="176" font-size="9" fill="#9ca3af" text-anchor="middle">wrap</text>
    <text x="80" y="166" font-size="13" font-weight="500" fill="#111827">Veg Wrap</text>
    <text x="80" y="184" font-size="12" fill="#6b7280">₹80 each  ·  ₹80</text>
    <rect x="262" y="158" width="84" height="30" rx="8" fill="#ffffff" stroke="#00000029" stroke-width="0.5"/>
    <text x="276" y="178" font-size="14" fill="#168acd" text-anchor="middle">−</text>
    <text x="304" y="178" font-size="13" font-weight="500" fill="#111827" text-anchor="middle">1</text>
    <text x="332" y="178" font-size="14" fill="#168acd" text-anchor="middle">+</text>
    <line x1="0" y1="214" x2="360" y2="214" stroke="#e5e7eb" stroke-width="0.5"/>

    <!-- Cart row 3: Mango Lassi × 1 -->
    <rect x="16" y="228" width="52" height="52" rx="8" fill="#e5e7eb"/>
    <text x="42" y="258" font-size="9" fill="#9ca3af" text-anchor="middle">lassi</text>
    <text x="80" y="248" font-size="13" font-weight="500" fill="#111827">Mango Lassi</text>
    <text x="80" y="266" font-size="12" fill="#6b7280">₹60 each  ·  ₹60</text>
    <rect x="262" y="240" width="84" height="30" rx="8" fill="#ffffff" stroke="#00000029" stroke-width="0.5"/>
    <text x="276" y="260" font-size="14" fill="#168acd" text-anchor="middle">−</text>
    <text x="304" y="260" font-size="13" font-weight="500" fill="#111827" text-anchor="middle">1</text>
    <text x="332" y="260" font-size="14" fill="#168acd" text-anchor="middle">+</text>
    <line x1="0" y1="296" x2="360" y2="296" stroke="#e5e7eb" stroke-width="0.5"/>

    <!-- Totals -->
    <rect x="0" y="296" width="360" height="8" fill="#f1f3f5"/>
    <text x="16" y="326" font-size="13" fill="#6b7280">Subtotal</text>
    <text x="344" y="326" font-size="13" fill="#111827" text-anchor="end">₹320</text>
    <text x="16" y="350" font-size="13" fill="#6b7280">Delivery</text>
    <text x="344" y="350" font-size="13" font-weight="500" fill="#1f8a3b" text-anchor="end">Free</text>
    <line x1="16" y1="364" x2="344" y2="364" stroke="#e5e7eb" stroke-width="0.5"/>
    <text x="16" y="386" font-size="14" font-weight="500" fill="#111827">Total</text>
    <text x="344" y="386" font-size="14" font-weight="500" fill="#111827" text-anchor="end">₹320</text>

    <!-- Sticky footer CTA -->
    <line x1="0" y1="580" x2="360" y2="580" stroke="#e5e7eb" stroke-width="0.5"/>
    <rect x="0" y="580" width="360" height="60" fill="#ffffff"/>
    <rect x="12" y="592" width="336" height="40" rx="8" fill="#168acd"/>
    <text x="180" y="617" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Place order  ·  ₹320</text>
  </g>
</svg>
